name: "Rebuild Data"
on:
  schedule:
    # Friday 04:00 UTC ≈ Friday 12:00 Asia/Shanghai — after Hub sync-target-data (Fri 02:00 UTC)
    - cron: "0 4 * * 5"
    # Sunday backup after Hub Sunday sync (Sun 02:00 UTC)
    - cron: "0 4 * * 0"
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - predtimechart-config.yml
      - predevals-config.yml
  workflow_dispatch:
    inputs:
      regenerate:
        description: "Force-rewrite existing forecast/target JSON (needed after Hub time-series updates an already-published as-of week)"
        type: boolean
        required: false
        default: false
      data:
        description: "Which forecast page data should be built?"
        type: choice
        options:
          - 'target'
          - 'forecast'
          - 'both'
        required: false
        default: 'both'
      publish:
        description: "Push Data to branch (uncheck for a dry run)"
        type: boolean
        required: false
        default: true

permissions:
  contents: write

jobs:
  site:
    uses: hubverse-org/hub-dashboard-control-room/.github/workflows/generate-data.yaml@main
    with:
      owner: '${{ github.event.repository.owner.login }}'
      name: '${{ github.event.repository.name }}'
      slug: '${{ github.event.repository.owner.login }}'
      email: '${{ github.event.repository.owner.id }}+${{ github.event.repository.owner.login }}@users.noreply.github.com'
      # Weekly cron must regenerate: predtimechart skips existing as-of target files when false.
      regenerate: ${{ github.event_name == 'schedule' || inputs.regenerate || false }}
      build: ${{ inputs.data || 'both' }}
      publish: ${{ inputs.publish || github.event_name == 'schedule' || github.event_name == 'push' }}
    secrets:
      id: 'none'
      key: ${{ secrets.GITHUB_TOKEN }}
