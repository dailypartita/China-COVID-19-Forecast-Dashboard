# Updated: 2026-10-30 — add rolling "Full season" / "Last 4 weeks" eval sets; quote all dates (schema requires strings).
# NOTE: relative_metrics/baseline intentionally disabled — MUST-SEIRS only submitted 2 rounds
# (2025-11-17, 2026-01-19) and hubEvals hard-fails when the baseline is absent from an eval set.
# Revisit once a model with full-season coverage is designated as baseline.
schema_version: https://raw.githubusercontent.com/hubverse-org/hubPredEvalsData/main/inst/schema/v1.0.1/config_schema.json
rounds_idx: 0
targets:
- target_id: wk inc covid prop ili
  metrics:
  - ae_median
  - wis
  - interval_coverage_95
  disaggregate_by:
  - target_end_date
  - location
  - horizon
eval_sets:
# Rolling window: covers all rounds since season start, auto-extends weekly
- eval_set_name: Full season
  round_filters:
    min: '2025-10-06'
  task_filters:
    location:
    - CN
    horizon:
    - 0
    - 1
    - 2
    - 3
# Rolling window: last 5 rounds with model output (≈ last 4 scored weeks;
# the latest round usually has no truth data yet at scoring time)
- eval_set_name: Last 4 weeks
  round_filters:
    min: '2025-10-06'
    n_last: 5
  task_filters:
    location:
    - CN
    horizon:
    - 0
    - 1
    - 2
    - 3
- eval_set_name: 2025 season 4
  round_filters:
    min: '2025-11-17'
  task_filters:
    location:
    - CN
    horizon:
    - 0
    - 1
    - 2
    - 3
    target_end_date:
    - '2025-10-13'
    - '2025-10-20'
    - '2025-10-27'
    - '2025-11-03'
    - '2025-11-10'
    - '2025-11-17'
